name: Deploy

# Manual only - a button press in the Actions tab, not an auto-deploy on
# every push. Rebuilding/redeploying is a deliberate act, same as the
# local CLI flow it replaces.
on:
  workflow_dispatch: {}

# id-token: write is required for Workload Identity Federation - GitHub
# mints a short-lived OIDC token this workflow exchanges for GCP access.
# No GCP credential is ever stored in this repo. issues: write lets the
# final step post this run's real outcome as an issue in this repo, via
# GitHub's own automatic, repo-scoped token - no new secret.
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.GCP_IMAGE }}"
          SHA="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"

      - name: Redeploy Cloud Run Job
        run: |
          gcloud run jobs update "${{ secrets.GCP_CLOUD_RUN_JOB }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --image="${{ secrets.GCP_IMAGE }}:latest"

      - name: Redeploy Cloud Run service
        id: deploy_service
        run: |
          gcloud run deploy "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --image="${{ secrets.GCP_IMAGE }}:latest"
          REVISION=$(gcloud run services describe "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --region="${{ secrets.GCP_REGION }}" --format='value(status.latestReadyRevisionName)')
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify health
        id: health_check
        run: |
          URL=$(gcloud run services describe "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          if curl -sf "$URL/health"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        if: always()
        with:
          enable-cache: true

      - run: uv python install
        if: always()

      - run: uv sync
        if: always()

      - name: Report status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m scripts.report_deploy_status \
            --success "${{ job.status == 'success' }}" \
            --commit-sha "${GITHUB_SHA::7}" \
            --image-tag "${{ secrets.GCP_IMAGE }}:latest" \
            --revision "${{ steps.deploy_service.outputs.revision }}" \
            --health-check-ok "${{ steps.health_check.outputs.ok }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
