[project]
name = "issue-triaging-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "google-genai>=2.16.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]
docs = [
    "matplotlib>=3.11.1",
]

[tool.pytest.ini_options]
markers = [
    "golden: live regression test against eval/golden_set.json - calls the real Gemini API, needs GEMINI_API_KEY. Excluded by default (see addopts); run explicitly with `pytest -m golden`.",
]
addopts = "-m 'not golden'"
